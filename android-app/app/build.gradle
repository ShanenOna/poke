apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.gabriel.pokems"
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.gabriel.pokems"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.6.1'

    // networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Note: including Kafka client on Android is non-trivial; in our design
    // the Android app will send REST calls to the Spring Boot backend which
    // then forwards messages into Kafka topics. If you want to talk directly
    // to Kafka from Android you'd add the client library below, but beware of
    // size and compatibility issues.
    // implementation 'org.apache.kafka:kafka-clients:3.2.0'
}